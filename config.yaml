# ------------------------------------------------------------------
# Competitor Radar config
# List your competitors (and optionally yourself). That's all most people need.
# Test the sites any time with:  python radar.py --check
# ------------------------------------------------------------------

title: Competitor Radar

# Used to tailor the analysis.
niche: Family location sharing, driving safety, and family-safety mobile apps
audience: Life360's marketing team, parents and families evaluating location-sharing and family-safety apps

window_days: 30          # the dashboard compares the last 30 days with the 30 before
first_run_days: 60       # on the first run, classify pages dated within this many days
max_classify_per_run: 200   # spend cap: extra pages wait for the next run

models:
  classify: claude-haiku-4-5-20251001   # one cheap call per new page
  analyse: claude-sonnet-5-5            # one call per run for the breakdown

# Optional: your own site, shown as the first row so gaps are relative to you.
you:
  name: Life360
  site: https://www.life360.com

# ------------------------------------------------------------------
# Competitors. Each needs a name and a site. The radar finds the sitemap
# (or feed) itself. If it can't, add one of these:
#   sitemap: https://example.com/post-sitemap.xml
#   feed:    https://example.com/blog/feed
# Optional:
#   include_pattern: /blog/     only count URLs matching this regex
#   exclude_pattern: /docs/     ignore URLs matching this regex
# ------------------------------------------------------------------
competitors:
  - name: Bark
    site: https://www.bark.us

  - name: FamiSafe
    site: https://www.familysafe.wondershare.com

  - name: Qustodio
    site: https://www.qustodio.com

  - name: GeoZilla
    site: https://geozilla.com

  - name: Find My Kids
    site: https://findmykids.org

  - name: Google Family Link
    site: https://families.google.com/familylink
